[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "zkss",
    "indexer",
    "settings",
    "mcp_server",
    "zkss_markdown",
    "rename_txt_to_md",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "mcp>=1.30.0,<2",
    "opentelemetry-api>=1.45.1",
    "pydantic-settings>=2.14.2",
    "oauthlib>=4.0.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.30",
    "requests>=2.34.0",
    "sentence-transformers>=5.6.0",
    "setuptools>=84.1.0,<85",
    "starlette>=1.0.1",
    "torch>=2.13.0,<2.14",
    "transformers>=5.10.0",
    "urllib3>=2.8.0",
]

[project]
name = "zk-smart-search"
version = "0.3.22"
description = "A smart Zettelkasten search tool with semantic capabilities and MCP support."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rich>=13.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "mcp>=1.30.0,<2",
]

[project.scripts]
zkss = "zkss:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
